kind = "mobile"
previewPath = "/mobile/"
title = "SquadCraft Mobile"
description = "Native mobile companion for SquadCraft with troop dashboards, member and activity management, and parent-facing child updates, persisted locally on each phone."
version = "1.0.0"
id = "artifacts/squadcraft-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 24140

[services.development]
run = "pnpm --filter @workspace/squadcraft-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/squadcraft-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/squadcraft-mobile", "run", "serve" ]

[services.env]
PORT = "24140"
BASE_PATH = "/mobile/"
